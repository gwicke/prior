[workspace]
members = [".", "crates/slashdot_menu", "crates/blockedit", "crates/bsed"]
resolver = "2"

[package]
name = "picocode"
version = "0.6.0"
authors = ["Dotan Nahum <dotan@rng0.io>"]
edition = "2021"
default-run = "picocode"
description = "The tiny, high-performance Rust coding agent that speaks every LLM."
license = "MIT"
repository = "https://github.com/jondot/picocode"
homepage = "https://github.com/jondot/picocode"
readme = "README.md"
keywords = ["cli", "ai", "coding-assistant", "llm", "agent", "rust", "claude"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["picocode.gif", ".github/"]

[dependencies]
rig-core = { git = "https://github.com/gwicke/rig", rev = "1c2f4405", features = ["derive"] }
slashdot_menu = { path = "crates/slashdot_menu" }
blockedit = { path = "crates/blockedit" }
bsed = { path = "crates/bsed" }
rig-agent = { git = "https://github.com/gwicke/rig", rev = "1c2f4405", features = ["derive"] }
rig-reqwest = { git = "https://github.com/gwicke/rig", rev = "1c2f4405" }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml_edit = { version = "0.25", features = ["serde"] }
clap = { version = "4.0", features = ["derive"] }
thiserror = "2.0.17"
regex = "1.0"
schemars = "1.2.0"
ignore = "0.4.25"
globset = "0.4.18"
tracing = "0.1.44"
console = "0.16.2"
termimad = "0.34.1"
codewandler-markdown-terminal = "0.2.1"
codewandler-markdown-stream = "0.2.1"
duct = { version = "1.1.1", features = ["timeout"] }
async-trait = "0.1"
crossterm = { version = "0.29", features = ["event-stream"] }
fuzzy-matcher = "0.3"
similar = "2"
unicode-segmentation = "1.12"
unicode-width = "0.1"
reqwest = { version = "0.13", features = ["json"] }
libc = "0.2"
futures = "0.3"
parking_lot = "0.12"
shellexpand = "3.1"
path-clean = "1.0"
uuid = { version = "1.0", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
urlencoding = "2.1"
memmap2 = "0.9"
memchr = "2.7"

[features]
default = []
# Optional feature that gates the `confirm_probe` test helper binary and its
# integration test.  Not needed for normal use or `cargo install`.
test-utils = []

[lib]
name = "picocode"
path = "src/lib.rs"

[[bin]]
name = "picocode"
path = "src/main.rs"

# The `bsed` binary is a two-line shim over the bsed crate (src/bin/bsed.rs)
# so that `cargo install --path .` installs both. The agent only ever runs
# `bsed preview`; see doc/bsed.md.
[[bin]]
name = "bsed"
path = "src/bin/bsed.rs"

# Test-only binary used by the confirm_raw_mode integration test.
# Gated behind `test-utils` so `cargo install --path .` does not install it.
[[bin]]
name = "confirm_probe"
path = "src/bin/confirm_probe.rs"
required-features = ["test-utils"]

# Gate the integration test that depends on `confirm_probe` behind the same
# feature so it's skipped when test-utils is not enabled.
[[test]]
name = "confirm_raw_mode"
path = "tests/confirm_raw_mode.rs"
required-features = ["test-utils"]

[dev-dependencies]
tempfile = "3.24.0"
portable-pty = "0.8"
vt100 = "0.16"
serial_test = "3.1"
rig-core = { git = "https://github.com/gwicke/rig", rev = "1c2f4405", features = ["test-utils"] }

# Fork of codewandler-markdown-terminal adding OSC 8 clickable inline links
# (gated by Theme.clickable_links) and a faded `Theme::dimmed()` for streamed
# thinking. Both crates are pinned to the same fork commit so
# `markdown_stream::Event` resolves to one type across picocode and the patched
# renderer. Once the fork is pushed, `cargo build` updates Cargo.lock to the
# git source. See doc/streaming_mode.md (§OSC 8 links, §Phase 5 thinking).
[patch.crates-io]
codewandler-markdown-terminal = { git = "https://github.com/gwicke/codewandler-markdown", rev = "c4f3b0760b21ff90e48ebf1312fea0fac21eb12b" }
codewandler-markdown-stream = { git = "https://github.com/gwicke/codewandler-markdown", rev = "c4f3b0760b21ff90e48ebf1312fea0fac21eb12b" }
