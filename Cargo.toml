[package]
name = "picocode"
version = "0.6.0"
authors = ["Dotan Nahum <dotan@rng0.io>"]
edition = "2021"
description = "The tiny, high-performance Rust coding agent that speaks every LLM."
license = "MIT"
repository = "https://github.com/jondot/picocode"
homepage = "https://github.com/jondot/picocode"
readme = "README.md"
keywords = ["cli", "ai", "coding-assistant", "llm", "agent", "rust", "claude"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["picocode.gif", ".github/"]

[dependencies]
rig-core = { version = "0.38", features = ["derive"] }
rig-derive = "0.38"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml_edit = { version = "0.25", features = ["serde"] }
clap = { version = "4.0", features = ["derive"] }
thiserror = "2.0.17"
indicatif = "0.18.3"
regex = "1.0"
schemars = "1.2.0"
ignore = "0.4.25"
globset = "0.4.18"
tracing = "0.1.44"
console = "0.16.2"
termimad = "0.34.1"
codewandler-markdown-terminal = "0.2.1"
codewandler-markdown-stream = "0.2.1"
duct = "1.1.1"
duct_sh = "1.0.0"
async-trait = "0.1"
crossterm = "0.29"
fuzzy-matcher = "0.3"
unicode-segmentation = "1.12"
unicode-width = "0.1"
reqwest = { version = "0.13", features = ["json"] }
libc = "0.2"

[lib]
name = "picocode"
path = "src/lib.rs"

[[bin]]
name = "picocode"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3.24.0"
portable-pty = "0.8"
vt100 = "0.16"
