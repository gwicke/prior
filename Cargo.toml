[package]
name = "picocode"
version = "0.6.0"
authors = ["Dotan Nahum <dotan@rng0.io>"]
edition = "2021"
description = "The tiny, high-performance Rust coding agent that speaks every LLM."
license = "MIT"
repository = "https://github.com/jondot/picocode"
homepage = "https://github.com/jondot/picocode"
readme = "README.md"
keywords = ["cli", "ai", "coding-assistant", "llm", "agent", "rust", "claude"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["picocode.gif", ".github/"]

[dependencies]
rig-core = { version = "0.40", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml_edit = { version = "0.25", features = ["serde"] }
clap = { version = "4.0", features = ["derive"] }
thiserror = "2.0.17"
indicatif = "0.18.3"
regex = "1.0"
schemars = "1.2.0"
ignore = "0.4.25"
globset = "0.4.18"
tracing = "0.1.44"
console = "0.16.2"
termimad = "0.34.1"
codewandler-markdown-terminal = "0.2.1"
codewandler-markdown-stream = "0.2.1"
duct = { version = "1.1.1", features = ["timeout"] }
async-trait = "0.1"
crossterm = "0.29"
fuzzy-matcher = "0.3"
unicode-segmentation = "1.12"
unicode-width = "0.1"
reqwest = { version = "0.13", features = ["json"] }
libc = "0.2"
futures = "0.3"
uuid = { version = "1.0", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

[lib]
name = "picocode"
path = "src/lib.rs"

[[bin]]
name = "picocode"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3.24.0"
portable-pty = "0.8"
vt100 = "0.16"
serial_test = "3.1"

# Fork of codewandler-markdown-terminal adding OSC 8 clickable inline links
# (gated by Theme.clickable_links) and a faded `Theme::dimmed()` for streamed
# thinking. Both crates are pinned to the same fork commit so
# `markdown_stream::Event` resolves to one type across picocode and the patched
# renderer. Once the fork is pushed, `cargo build` updates Cargo.lock to the
# git source. See doc/streaming_mode.md (§OSC 8 links, §Phase 5 thinking).
[patch.crates-io]
codewandler-markdown-terminal = { git = "https://github.com/gwicke/codewandler-markdown", rev = "41d0922" }
codewandler-markdown-stream = { git = "https://github.com/gwicke/codewandler-markdown", rev = "41d0922" }
rig-core = { git = "file:///home/gabriel/src/rig", rev = "39ff227587bda9fd37991518d6fb220a34173f8a" }
