[workspace]
members = [".", "crates/slashdot-menu", "crates/slashdot-tui", "crates/bsed-blockedit", "crates/bsed"]
resolver = "3"
package = { version = "0.1.0" }

# Two lints that fire on shape rather than on correctness. Both are answered by
# "extract a type", and here the extraction would cost more than it buys: the
# signatures are internal and single-site, and the fields are already
# individually named and documented. `type_complexity` is kept honest the way
# that matters — a *shape that recurs* gets an alias (see `crate::SubmitFn`,
# which replaced six copies of the same boxed callback).
#
# Deliberately not workspace-wide: lints whose advice is wrong for this code
# are allowed at the site, with a reason, so a genuine occurrence elsewhere is
# still reported. `drop_non_drop` on `ConsoleOutput::with_content_writer` is
# the case in point.
[workspace.lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"

[workspace.dependencies]
# Sub-crates: versions inherited from workspace.package
bsed = { path = "crates/bsed" }
bsed-blockedit = { path = "crates/bsed-blockedit" }
slashdot-menu = { path = "crates/slashdot-menu" }
slashdot-tui = { path = "crates/slashdot-tui" }

[package]
name = "prior-agent"
version = "0.1.0"
authors = ["Gabriel Wicke <gswicke@gmail.com>", "Dotan Nahum <dotan@rng0.io>"]
edition = "2021"
default-run = "prior"
description = "A small coding agent inspired by and session-compatible with pi."
license = "GPL-3.0-or-later"
repository = "https://github.com/gwicke/prior"
homepage = "https://github.com/gwicke/prior"
readme = "README.md"
keywords = ["cli", "ai", "coding-assistant", "llm", "agent"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["prior.gif", ".github/"]

[lints]
workspace = true

[dependencies]
# `reqwest` gives the concrete provider clients their `from_env` / `client`
# constructors on the shared `rig-reqwest` transport.
rig-core = { version = "0.45.0", features = ["derive", "reqwest"] }
slashdot-menu = { workspace = true }
slashdot-tui = { workspace = true }
bsed-blockedit = { workspace = true }
rig-agent = { version = "0.45.0", features = ["derive"] }
rig-reqwest = { version = "0.45.0" }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml_edit = { version = "0.25", features = ["serde"] }
clap = { version = "4.0", features = ["derive"] }
thiserror = "2.0.17"
regex = "1.0"
schemars = "1.2.0"

tracing = "0.1.44"
console = "0.16.2"
termimad = "0.34.1"
gwicke-markdown-terminal = "0.2.1"
gwicke-markdown-stream = "0.2.1"
duct = { version = "1.1.1", features = ["timeout"] }
async-trait = "0.1"
crossterm = { version = "0.29", features = ["event-stream"] }
fuzzy-matcher = "0.3"
similar = "2"
unicode-segmentation = "1.12"
unicode-width = "0.2"
reqwest = { version = "0.13", features = ["json"] }
libc = "0.2"
futures = "0.3"
parking_lot = "0.12"
shellexpand = "3.1"
path-clean = "1.0"
uuid = { version = "1.0", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
urlencoding = "2.1"
memmap2 = "0.9"
memchr = "2.7"
# Event-driven watch of settings.toml's directory, so external edits reach the
# running session without mtime polling (src/settings_watch.rs).
notify = "8"

[features]
default = []
# Optional feature that gates the `confirm_probe` test helper binary and its
# integration test.  Not needed for normal use or `cargo install`.
test-utils = []

[lib]
name = "prior"
path = "src/lib.rs"

[[bin]]
name = "prior"
path = "src/main.rs"

# The `bsed` binary is NOT declared here: it belongs to the `bsed` package
# (crates/bsed), which is the sole owner of that target. Two packages declaring
# the same bin name is an `output filename collision` on any workspace-wide
# build (cargo#6313), so prior shells out to the `bsed` package's binary instead
# of wrapping it in a shim here. A root-only `cargo build` therefore does not
# produce `target/debug/bsed`; build the workspace (`cargo build --workspace`)
# or `cargo install bsed`. See doc/bsed.md §7.

# The `prior-egress` shim is bwrap's payload when the sandbox has network
# egress: it binds a listener inside the sandbox's netns and hands the fd back
# to prior. Installed alongside prior so the bridge can resolve it absolutely.
# See `src/egress.rs` and `doc/261021_sandbox_env_x11_audit.md` (R3b).
[[bin]]
name = "prior-egress"
path = "src/bin/prior-egress.rs"

# Test-only binary used by the confirm_raw_mode integration test.
# Gated behind `test-utils` so `cargo install --path .` does not install it.
[[bin]]
name = "confirm_probe"
path = "src/bin/confirm_probe.rs"
required-features = ["test-utils"]

# Gate the integration test that depends on `confirm_probe` behind the same
# feature so it's skipped when test-utils is not enabled.
[[test]]
name = "confirm_raw_mode"
path = "tests/confirm_raw_mode.rs"
required-features = ["test-utils"]

[dev-dependencies]
tempfile = "3.24.0"
portable-pty = "0.8"
vt100 = "0.16"
serial_test = "3.1"
# tcgetattr/tcsetattr in the pty termios regression tests
# (tests/quit_restores_cooked_mode.rs) — already a regular dependency; the
# dev edge lets integration tests name it directly.
libc = "0.2"
rig-core = { version = "0.45.0", features = ["test-utils", "reqwest"] }
# Test-only seams of the drawing crate (`TermIO::recording`, `RenderManager::draw`)
# — features of a dependency unify per-build, so `cargo test` sees them and a
# production `cargo build` does not.
slashdot-tui = { version = "0.1.0", path = "crates/slashdot-tui", features = ["test-helpers"] }

# Fork of codewandler-markdown-terminal adding OSC 8 clickable inline links
# (gated by Theme.clickable_links) and a faded `Theme::dimmed()` for streamed
# thinking. Both crates are pinned to the same fork commit so
# `markdown_stream::Event` resolves to one type across prior and the patched
# renderer. Once the fork is pushed, `cargo build` updates Cargo.lock to the
# git source. See doc/streaming_mode.md (§OSC 8 links, §Phase 5 thinking).
[patch.crates-io]
# codewandler-markdown-terminal = { git = "https://github.com/gwicke/codewandler-markdown", branch = "main" }
# codewandler-markdown-stream = { git = "https://github.com/gwicke/codewandler-markdown", branch = "main" }
# TEMPORARY: tracks the local checkout of the sed-rs fork while the upstream PR
# for `a`/`i`/`c` text whitespace is open. `sed-rs` 2.0.0 drops leading
# whitespace from the text of a backslash-introduced `a`/`i`/`c`, which makes a
# `bsed` preview of indented inserted text wrong in a way that is invisible
# until applied. Delete this line once the PR lands and a released `sed-rs`
# carries the fix; see crates/bsed/src/script.rs (`expand_text_escapes`).
# sed-rs = { git = "https://github.com/gwicke/sed-rs.git", branch = "main" }
