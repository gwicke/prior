name: CI

# CI workflow: validates every change on push and PR
# Separate from release workflow to keep validation fast and focused
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # Build and test job: ensures code compiles and tests pass
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build project
        # `--workspace` is load-bearing: `bsed` is a `[[bin]]` of the `bsed`
        # crate, not of prior-agent, so a root-only build would not produce
        # `target/debug/bsed`. The `sed` tool tests resolve that binary from the
        # target profile dir and *skip* when it is absent — which would let the
        # whole sed/bsed path go untested while the job stays green.
        run: cargo build --workspace --verbose

      - name: Install cargo-nextest
        # Needed because `cargo test` runs test binaries one at a time, and the
        # suite is lopsided: `mock_turn` alone is ~31s and `retry_backoff`
        # ~27s, so the binaries' runtimes add up rather than overlap. Roughly
        # 79s of work sat behind a 90s wall clock; nextest runs each binary as
        # its own process so the floor becomes the slowest single binary
        # (~32s) instead of the sum. Measured 1052/1052 passing, 90.7s -> 37.9s.
        uses: taiki-e/install-action@nextest

      - name: Run tests
        # `--features test-utils` is not optional: `confirm_raw_mode` is gated
        # behind it, and plain `cargo test` silently skips it — which is how a
        # missing quick key survived three implementation phases (ui_draw_v2
        # §9 #9). Keep the two in one step so they cannot drift apart.
        #
        # nextest runs each test in its OWN process, which also removes a whole
        # class of flakiness for free: the suite leans on process globals
        # (`TERMINAL_WIDTH`, `set_current_dir`, the `SANDBOX` and
        # `sandbox_state` statics, env vars), and several of those are mutated
        # by `#[serial]` tests purely to keep neighbours off them.
        #
        # Deliberately NOT adding `--no-fail-fast`, and no retries: a retry here
        # would mask exactly the cross-test interference that the `#[serial]`
        # annotations were added to expose.
        run: cargo nextest run --features test-utils

  # Clippy job: ADVISORY ONLY. Reports warnings, never fails the workflow, so
  # it cannot block a push while a lint backlog is being worked down. Runs as
  # its own job rather than a third step in `test` so it checks in parallel
  # instead of adding to the critical path.
  #
  # `continue-on-error` is on the job, not the step, so the job still reports
  # as failed-but-allowed in the checks list — a real clippy failure (not a
  # lint, but e.g. a broken manifest) is visible instead of silently green.
  #
  # No `-D warnings` yet. The workspace already silences `type_complexity` and
  # `too_many_arguments` via `[workspace.lints]`; promote to a hard gate once
  # the remaining warnings are down to zero.
  clippy:
    name: Clippy (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run clippy
        # Mirrors the test step's `--features test-utils` for the same reason:
        # without it the confirm_probe binary and its lints are never checked.
        run: cargo clippy --workspace --all-targets --features test-utils

