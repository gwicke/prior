[package]
name = "slashdot_menu"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Data-driven slash-menu engine: descriptors, path grammar, filter/sort, and overlay interpreter."

[lints]
workspace = true

[dependencies]
fuzzy-matcher = "0.3"
unicode-width = "0.1"
async-trait = "0.1"
slashdot_tui = { path = "../slashdot_tui" }

[dev-dependencies]
futures = "0.3"
slashdot_tui = { path = "../slashdot_tui", features = ["test-helpers"] }
