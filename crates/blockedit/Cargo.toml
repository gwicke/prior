[package]
name = "blockedit"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "The @@@OLD/@@@NEW/@@@END block-edit core: blob parser, match resolver, and applier. Pure — no agent, no I/O policy."

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
similar = "2"
schemars = "1.2.0"
shellexpand = "3.1"
path-clean = "1.0"
# Width-aware column arithmetic for the arg-error table (see arg_error_view).
unicode-width = "0.1"
