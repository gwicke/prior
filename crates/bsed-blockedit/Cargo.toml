[package]
name = "bsed-blockedit"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "An @@@OLD/@@@NEW/@@@END block-edit core: block parser, match resolver, and applier."
homepage = "https://github.com/gwicke/prior"
repository = "https://github.com/gwicke/prior"

[lints]
workspace = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
similar = "2"
schemars = "1.2.0"
shellexpand = "3.1"
path-clean = "1.0"
# Width-aware column arithmetic for the arg-error table (see arg_error_view).
unicode-width = "0.1"
