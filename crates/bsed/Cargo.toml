[package]
name = "bsed"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Preview a GNU sed script as line-anchored @@@OLD/@@@NEW/@@@END block edits. Ships the `bsed` binary."
homepage = "https://github.com/gwicke/prior"
repository = "https://github.com/gwicke/prior"

[lints]
workspace = true

[dependencies]
bsed-blockedit = { version = "0.1.0", path = "../bsed-blockedit" }
# The walker for `preview -r`: .gitignore-aware, skips hidden files, and
# already in the tree via prior, so this is no new download.
ignore = "0.4.25"
# For preview -r's --glob, with the same matcher and the same semantics as
# prior's `find` tool, so one mental model covers both.
globset = "0.4.18"
sed-rs = "2"
similar = "2"
thiserror = "2"
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.24.0"
# For the pty test: "is stdout a terminal" is the question under test.
portable-pty = "0.8"
# `emit_tests::spool_respects_the_directory_override` overrides `BSED_SPOOL_DIR`,
# which is process-global, so it must not run beside another thread reading it.
serial_test = "3.1"
