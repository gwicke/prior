[package]
name = "slashdot_tui"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Drawing stack between content and the terminal: RenderElement/RenderManager, Draw, TermIO, ANSI/width utilities."

[lints]
workspace = true

[features]
# Test-only seams (`TermIO::recording`, `RenderManager::draw`, …) — off in
# production builds, on for prior's dev-dependency.
test-helpers = []

[dependencies]
tokio = { version = "1.0", features = ["sync"] }
crossterm = { version = "0.29", features = ["event-stream"] }
unicode-width = "0.1"
libc = "0.2"

[dev-dependencies]
vt100 = "0.16"
