[package]
name = "slashdot-tui"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Drawing stack for composing scrollback above raw / frame content: RenderElement/RenderManager, Draw, TermIO, ANSI/width utilities."
homepage = "https://github.com/gwicke/prior"
repository = "https://github.com/gwicke/prior"

[lints]
workspace = true

[features]
# Test-only seams (`TermIO::recording`, `RenderManager::draw`, …) — off in
# production builds, on for prior's dev-dependency.
test-helpers = []

[dependencies]
tokio = { version = "1.0", features = ["sync"] }
crossterm = { version = "0.29", features = ["event-stream"] }
unicode-width = "0.2"
libc = "0.2"

[dev-dependencies]
vt100 = "0.16"
