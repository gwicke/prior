[package]
name = "slashdot-menu"
version = { workspace = true }
edition = "2021"
license = "GPL-3.0-or-later"
description = "Data-driven slash-menu engine: descriptors, path grammar, filter/sort, and overlay interpreter."
homepage = "https://github.com/gwicke/prior"
repository = "https://github.com/gwicke/prior"

[lints]
workspace = true

[dependencies]
fuzzy-matcher = "0.3"
unicode-width = "0.2"
async-trait = "0.1"
slashdot-tui = { workspace = true }

[dev-dependencies]
futures = "0.3"
slashdot-tui = { workspace = true, features = ["test-helpers"] }
